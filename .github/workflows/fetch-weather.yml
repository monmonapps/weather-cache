name: fetch-weather

on:
  schedule:
    # 6h interval, anchored so fresh data lands before morning wake-ups.
    # JST 04:17 / 10:17 / 16:17 / 22:17 = UTC 19:17 / 01:17 / 07:17 / 13:17.
    # Minute :17 is a low-traffic slot on GitHub Actions' shared scheduler;
    # the more common :00 / :05 / :30 minutes see frequent multi-hour delays
    # and skipped runs under load. See observed runs on 2026-05-23 where
    # the previous :35 schedule still missed slots and ran 1-5h late.
    # 6h x 4/day x 2632 cells x 1.9 (Open-Meteo variable weight) ~= 600K calls/month,
    # leaving 40% headroom under the Standard plan's 1M/month limit.
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      fetch_limit:
        description: "Limit to first N cells (0 = no limit, full grid)"
        type: string
        default: "0"

concurrency:
  group: fetch-weather
  # Drop any queued/running fetch when a newer schedule slot fires.
  # Stale data from the previous run stays in gh-pages because fetch.py
  # only writes successful cells (see "Restore previous gh-pages contents"
  # step), so cancelling mid-flight is safe and prevents skipped slots
  # when an earlier run overruns into the next slot.
  cancel-in-progress: true

permissions:
  contents: write           # required for peaceiris/actions-gh-pages

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Opt all JS actions in this job into Node 24 ahead of GitHub's 2026-06-02
    # forced switch. Lets us verify peaceiris/actions-gh-pages@v4 (still declared
    # as node20) actually works on Node 24, rather than discovering breakage
    # after the deadline.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6

      # Pull the previously published v1/ JSONs into the workspace before
      # fetch.py runs. fetch.py only writes successful cells; cells that
      # fail this run keep their previous JSON in the deployed output.
      # Without this step, force_orphan would silently delete failed cells.
      # First-ever run: gh-pages branch doesn't exist yet, so continue-on-error
      # makes the step harmless.
      - name: Restore previous gh-pages contents
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: __prev_gh_pages

      - name: Stage previous JSONs into docs/v1/
        run: |
          mkdir -p docs/v1
          if [ -d __prev_gh_pages/v1 ]; then
            cp -r __prev_gh_pages/v1/. docs/v1/
            echo "Restored $(ls docs/v1 | wc -l) previous JSON file(s)"
          else
            echo "No previous gh-pages content to restore (first run?)"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: pip install -r fetch/requirements.txt

      - name: Fetch and transform
        env:
          OPENMETEO_APIKEY: ${{ secrets.OPENMETEO_APIKEY }}
          URL_SALT:         ${{ secrets.URL_SALT }}
          FETCH_LIMIT:      ${{ github.event.inputs.fetch_limit || '0' }}
        run: python fetch/fetch.py

      # peaceiris/actions-gh-pages v4 is the latest but still declares node20.
      # GitHub will force-run Node 20 actions on Node 24 starting 2026-06-02;
      # if this action breaks at that point, switch to actions/deploy-pages.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
