name: fetch-weather

on:
  schedule:
    - cron: "5 */3 * * *"   # every 3 hours, 5 min past the hour
  workflow_dispatch:        # allow manual run

concurrency:
  group: fetch-weather
  cancel-in-progress: false

permissions:
  contents: write           # required for peaceiris/actions-gh-pages

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: pip install -r fetch/requirements.txt

      - name: Fetch and transform
        env:
          OPENMETEO_APIKEY: ${{ secrets.OPENMETEO_APIKEY }}
          URL_SALT:         ${{ secrets.URL_SALT }}
        run: python fetch/fetch.py

      # peaceiris/actions-gh-pages v4 is the latest but still declares node20.
      # GitHub will force-run Node 20 actions on Node 24 starting 2026-06-02;
      # if this action breaks at that point, switch to actions/deploy-pages.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
